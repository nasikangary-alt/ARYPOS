<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Vibrant Red to Orange) -->
    <linearGradient id="bgRedOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C62828"/>
      <stop offset="40%" stop-color="#E53935"/>
      <stop offset="75%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>

    <!-- ARY Lettering Red Gradient -->
    <linearGradient id="iconAryRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="65%" stop-color="#D50000"/>
      <stop offset="100%" stop-color="#8E0000"/>
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="iconFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00"/>
      <stop offset="50%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#FFEA00"/>
    </linearGradient>

    <!-- Beak Gradient -->
    <linearGradient id="iconBeakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>

    <!-- App Icon Shadow -->
    <filter id="iconElementShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Rounded Square (Squircle) -->
  <rect width="512" height="512" rx="116" fill="url(#bgRedOrange)"/>

  <!-- Subtle Inner Ring Highlight -->
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Centered Mascot & ARY Master Graphics -->
  <g transform="translate(256, 245) scale(0.92)" filter="url(#iconElementShadow)">

    <!-- 1. BACK RED CREST / HALO BEHIND HEAD -->
    <!-- White outer stroke -->
    <path d="M -90 -60 C -105 -130, -35 -165, 35 -165 C 100 -165, 150 -130, 140 -60 C 133 -15, 100 20, 45 25 C -30 30, -80 -5, -90 -60 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    <!-- Red Fill -->
    <path d="M -87 -60 C -100 -125, -33 -160, 35 -160 C 95 -160, 143 -125, 135 -60 C 129 -20, 95 15, 43 20 C -25 25, -77 -10, -87 -60 Z"
          fill="#D50000"/>

    <!-- 2. CHICKEN WHITE HEAD -->
    <!-- White Silhouette with clean stroke -->
    <path d="M -105 30 C -105 20, -65 -85, 40 -90 C 95 -92, 120 -55, 105 -10 C 95 15, 65 35, 5 45 C -55 55, -100 45, -105 30 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
    <path d="M -100 30 C -90 -60, -25 -85, 50 -85 C 100 -85, 115 -50, 100 -10 C 90 15, 60 40, -5 45 C -55 50, -95 40, -100 30 Z"
          fill="#FFFFFF"/>

    <!-- 3. ROOSTER COMB -->
    <g>
      <path d="M -40 -80 C -60 -130, -10 -155, 20 -120 C 40 -160, 90 -155, 95 -110 C 120 -125, 145 -95, 125 -65 Z"
            fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
      <path d="M -37 -82 C -53 -125, -10 -148, 17 -115 C 40 -152, 85 -148, 90 -108 C 113 -120, 137 -92, 120 -68 Z"
            fill="#D50000"/>
    </g>

    <!-- 4. ROOSTER EYE -->
    <circle cx="50" cy="-55" r="14" fill="#1A1A1A"/>
    <circle cx="46" cy="-59" r="5" fill="#FFFFFF"/>
    <circle cx="53" cy="-52" r="2.5" fill="#FFFFFF"/>

    <!-- 5. SQUAWKING OPEN BEAK -->
    <path d="M 80 -65 L 140 -55 L 100 -15 L 77 -35 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    <path d="M 81 -62 L 135 -52 L 93 -34 Z" fill="url(#iconBeakGrad)"/>
    <path d="M 91 -34 L 125 -45 L 97 -18 Z" fill="#FF8F00"/>
    <path d="M 85 -50 L 115 -48 L 90 -30 Z" fill="#8E0000"/>

    <!-- 6. RED WATTLE -->
    <path d="M 55 -30 C 55 -30, 45 15, 67 22 C 85 28, 93 0, 85 -25 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M 57 -28 C 57 -28, 49 12, 67 18 C 81 22, 89 -2, 83 -24 Z" fill="#D50000"/>

    <!-- 7. SOUND WAVES -->
    <g fill="#FFD54F" stroke="#FFFFFF" stroke-width="2">
      <path d="M 150 -80 C 160 -82, 170 -76, 175 -70 C 165 -68, 157 -72, 150 -80 Z"/>
      <path d="M 157 -50 C 173 -52, 185 -47, 190 -42 C 175 -38, 165 -42, 157 -50 Z"/>
      <path d="M 147 -25 C 160 -20, 167 -12, 170 -5 C 157 -8, 151 -16, 147 -25 Z"/>
    </g>

    <!-- 8. "ARY" 3D LETTERING EMBLEM -->
    <g transform="translate(-250, -180)">
      <!-- White Base for ARY -->
      <!-- A -->
      <path d="M 165 220 C 210 210, 225 230, 215 290 L 185 385 C 180 395, 155 395, 145 380 L 135 330 L 85 335 L 65 385 C 55 400, 30 395, 25 380 L 85 235 C 95 215, 130 215, 165 220 Z"
            fill="#FFFFFF" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- R -->
      <path d="M 225 220 C 285 210, 360 220, 360 285 C 360 325, 330 345, 295 350 L 365 385 C 375 392, 365 405, 345 405 L 285 405 L 245 355 L 225 355 L 215 395 C 210 405, 190 405, 185 390 L 210 230 Z"
            fill="#FFFFFF" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- Y -->
      <path d="M 365 225 C 380 220, 400 235, 390 255 L 360 320 L 360 385 C 360 400, 335 400, 330 385 L 330 325 L 285 255 C 275 235, 295 220, 310 225 L 345 280 Z"
            fill="#FFFFFF" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- Flame on Y -->
      <path d="M 485 185 C 505 210, 495 245, 460 260 C 470 235, 455 220, 440 220 C 465 200, 475 175, 485 185 Z"
            fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>

      <!-- Red Letters -->
      <path d="M 155 225 C 195 218, 212 235, 202 290 L 176 378 C 173 386, 158 386, 153 376 L 140 322 L 82 327 L 66 376 C 60 387, 44 384, 40 374 L 90 238 C 98 222, 125 222, 155 225 Z"
            fill="url(#iconAryRed)"/>
      <path d="M 115 298 L 148 295 C 155 294, 158 280, 152 260 C 145 245, 135 245, 128 255 Z" fill="#FFFFFF"/>

      <path d="M 230 228 C 280 220, 345 228, 345 282 C 345 318, 318 334, 288 338 L 352 378 C 360 384, 352 396, 336 396 L 288 396 L 248 346 L 222 346 L 212 386 C 208 394, 196 394, 192 382 L 216 238 Z"
            fill="url(#iconAryRed)"/>
      <path d="M 242 256 C 272 252, 308 256, 308 282 C 308 304, 278 310, 246 310 Z" fill="#FFFFFF"/>

      <path d="M 368 230 C 378 225, 392 238, 384 252 L 356 314 L 356 380 C 356 392, 340 392, 336 380 L 336 318 L 296 252 C 288 238, 302 225, 314 230 L 346 282 Z"
            fill="url(#iconAryRed)"/>
      <path d="M 375 240 C 405 270, 455 290, 490 245 C 498 275, 460 315, 410 340 L 365 380 C 355 390, 340 380, 348 365 L 385 320 Z"
            fill="url(#iconAryRed)"/>

      <!-- Flame fill -->
      <path d="M 485 188 C 502 212, 492 242, 462 256 C 470 234, 458 222, 444 222 C 466 204, 475 180, 485 188 Z"
            fill="url(#iconFlameGrad)"/>
      <path d="M 478 202 C 488 218, 482 236, 466 244 C 472 228, 464 220, 455 220 C 468 208, 472 196, 478 202 Z"
            fill="#FFF59D"/>
    </g>

    <!-- 9. "AYAM GEPREK" BADGE UNDER ARY -->
    <g transform="translate(0, 185)">
      <!-- Orange curved accent -->
      <path d="M -90 0 C -30 -10, 30 -10, 90 0 C 30 -6, -30 -6, -90 0 Z" fill="#FFA000" stroke="#FFA000" stroke-width="4"/>
      
      <!-- Ayam Geprek Text -->
      <text x="0" y="24" text-anchor="middle" font-family="'Brush Script MT', 'Lobster', cursive, sans-serif"
            font-size="34" font-weight="900" font-style="italic" fill="#FFFFFF" stroke="#D50000" stroke-width="6" stroke-linejoin="round" paint-order="stroke fill">
        Ayam Geprek
      </text>
    </g>

  </g>
</svg>
