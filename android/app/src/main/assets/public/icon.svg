<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Vibrant Red to Warm Orange -->
    <linearGradient id="appIconBgGradI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E51926"/>
      <stop offset="35%" stop-color="#F23618"/>
      <stop offset="70%" stop-color="#FF6A14"/>
      <stop offset="100%" stop-color="#FF9000"/>
    </linearGradient>

    <!-- Beak Gradient -->
    <linearGradient id="beakYellowGradI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>

    <!-- Drop Shadow for 3D depth -->
    <filter id="mascotShadowI" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#800606" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 1. Background Squircle (Rounded Square) -->
  <rect width="512" height="512" rx="116" fill="url(#appIconBgGradI)"/>

  <!-- Subtle Shading Accents on Background -->
  <path d="M 0 0 L 220 0 C 180 80, 100 160, 0 200 Z" fill="#FFFFFF" fill-opacity="0.08"/>
  <path d="M 512 512 L 320 512 C 360 420, 430 360, 512 320 Z" fill="#8E0808" fill-opacity="0.15"/>

  <!-- 2. Master Artwork Group (Rooster Mascot + ARY 3D Typography) -->
  <g id="master-artwork" filter="url(#mascotShadowI)">

    <!-- A. ROOSTER CHARACTER -->
    <g id="rooster-character">
      <!-- Dark Red Thick Outline -->
      <path d="M 230 80 C 180 75, 175 145, 195 175 C 220 150, 245 130, 280 135 C 265 95, 305 60, 340 85 C 375 70, 415 110, 395 155 C 420 170, 425 210, 395 240 C 390 280, 340 300, 290 290 C 210 295, 160 250, 150 180 C 145 150, 180 85, 230 80 Z"
            fill="#8E0808" stroke="#8E0808" stroke-width="12" stroke-linejoin="round"/>

      <!-- Red Comb -->
      <path d="M 232 85 C 190 85, 185 145, 205 170 C 235 145, 255 130, 290 138 C 275 98, 310 68, 342 90 C 375 78, 410 115, 392 155 C 418 172, 418 208, 392 235 C 375 255, 335 265, 295 260 C 240 260, 195 230, 185 175 C 180 145, 200 95, 232 85 Z"
            fill="#E51926"/>
      
      <!-- Comb White Highlights -->
      <path d="M 215 105 C 230 90, 255 90, 265 102" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8"/>
      <path d="M 315 82 C 335 75, 355 80, 368 95" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8"/>
      <path d="M 388 115 C 405 125, 410 145, 402 165" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8"/>

      <!-- Rooster White Head & Neck -->
      <path d="M 170 230 C 155 200, 190 135, 265 135 C 335 135, 370 185, 360 245 C 350 295, 305 325, 235 325 C 185 325, 155 275, 170 230 Z"
            fill="#8E0808" stroke="#8E0808" stroke-width="12" stroke-linejoin="round"/>
      <path d="M 172 230 C 160 202, 192 140, 265 140 C 332 140, 365 188, 355 245 C 345 292, 302 320, 235 320 C 188 320, 160 272, 172 230 Z"
            fill="#FFFFFF"/>

      <!-- Soft Grey Shading -->
      <path d="M 175 220 C 180 180, 215 145, 255 142 C 220 155, 195 190, 192 235 C 190 270, 205 295, 235 315 C 200 310, 175 275, 175 220 Z"
            fill="#E8ECF2"/>

      <!-- Rooster Eye -->
      <circle cx="282" cy="188" r="14" fill="#1A1A1A"/>
      <circle cx="278" cy="184" r="5" fill="#FFFFFF"/>
      <circle cx="285" cy="191" r="2.5" fill="#FFFFFF"/>

      <!-- Open Squawking Beak -->
      <path d="M 315 175 L 395 190 L 335 248 L 305 220 Z" fill="#8E0808" stroke="#8E0808" stroke-width="10" stroke-linejoin="round"/>
      <path d="M 316 178 L 390 192 L 328 218 Z" fill="url(#beakYellowGradI)"/>
      <path d="M 326 218 L 372 205 L 334 244 Z" fill="#FF8F00"/>
      <path d="M 322 198 L 360 200 L 328 222 Z" fill="#8E0808"/>

      <!-- Red Wattle -->
      <path d="M 285 225 C 285 225, 275 285, 305 290 C 330 295, 340 255, 325 225 Z" fill="#8E0808" stroke="#8E0808" stroke-width="8"/>
      <path d="M 288 228 C 288 228, 280 280, 305 285 C 324 288, 332 255, 322 228 Z" fill="#E51926"/>
      <path d="M 295 240 C 295 265, 305 278, 314 278" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>

      <!-- 3 Yellow Sound Sparks -->
      <g fill="#FFD54F" stroke="#8E0808" stroke-width="3">
        <path d="M 405 160 C 420 152, 435 158, 442 165 C 430 172, 418 168, 405 160 Z"/>
        <path d="M 418 198 C 440 195, 458 205, 462 215 C 442 218, 428 210, 418 198 Z"/>
        <path d="M 402 240 C 420 250, 432 265, 435 275 C 418 268, 410 255, 402 240 Z"/>
      </g>
    </g>

    <!-- B. BOLD 3D "ARY" TYPOGRAPHY -->
    <g id="ary-3d-text" transform="translate(0, 10)">
      <!-- 3D Base -->
      <path d="M 195 290 C 235 280, 260 300, 245 365 L 210 470 C 205 485, 170 485, 160 465 L 148 405 L 90 410 L 68 465 C 55 485, 25 480, 18 460 L 88 305 C 98 285, 140 285, 195 290 Z"
            fill="#7A0000" stroke="#7A0000" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M 270 290 C 335 275, 420 290, 420 365 C 420 415, 385 438, 345 445 L 425 485 C 438 495, 425 512, 400 512 L 335 512 L 290 452 L 265 452 L 252 498 C 248 510, 222 510, 218 492 L 248 305 Z"
            fill="#7A0000" stroke="#7A0000" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M 430 295 C 450 288, 475 308, 462 330 L 425 405 L 425 475 C 425 495, 395 495, 388 475 L 388 410 L 335 330 C 322 305, 345 288, 365 295 L 408 360 Z"
            fill="#7A0000" stroke="#7A0000" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- Vibrant Red Layer -->
      <path d="M 195 280 C 235 270, 258 290, 245 355 L 210 460 C 205 475, 172 475, 162 455 L 148 395 L 90 400 L 70 455 C 58 475, 28 470, 20 450 L 90 295 C 100 275, 142 275, 195 280 Z"
            fill="#C40D0D" stroke="#C40D0D" stroke-width="14" stroke-linejoin="round"/>
      <path d="M 270 280 C 335 265, 415 280, 415 355 C 415 405, 380 428, 342 435 L 420 475 C 432 485, 420 502, 395 502 L 332 502 L 288 442 L 265 442 L 252 488 C 248 500, 225 500, 220 482 L 248 295 Z"
            fill="#C40D0D" stroke="#C40D0D" stroke-width="14" stroke-linejoin="round"/>
      <path d="M 428 285 C 448 278, 472 298, 460 320 L 422 395 L 422 465 C 422 485, 395 485, 388 465 L 388 400 L 335 320 C 322 295, 345 278, 365 285 L 405 350 Z"
            fill="#C40D0D" stroke="#C40D0D" stroke-width="14" stroke-linejoin="round"/>

      <!-- White Bubble Letters -->
      <path d="M 190 270 C 228 262, 248 280, 238 340 L 206 440 C 202 452, 178 452, 170 438 L 152 380 L 92 385 L 75 438 C 65 455, 38 450, 32 435 L 94 285 C 104 265, 142 265, 190 270 Z"
            fill="#FFFFFF"/>
      <path d="M 125 350 L 160 346 C 168 345, 172 328, 164 305 C 155 288, 142 288, 134 300 Z" fill="#C40D0D"/>

      <path d="M 265 270 C 325 258, 400 270, 400 342 C 400 388, 368 410, 332 416 L 405 456 C 416 465, 406 480, 385 480 L 328 480 L 285 425 L 260 425 L 248 468 C 244 478, 228 478, 224 462 L 248 285 Z"
            fill="#FFFFFF"/>
      <path d="M 285 315 C 322 310, 362 315, 362 342 C 362 368, 325 375, 288 375 Z" fill="#C40D0D"/>

      <path d="M 422 275 C 440 268, 460 288, 450 308 L 415 380 L 415 450 C 415 468, 392 468, 388 450 L 388 385 L 338 308 C 326 285, 348 268, 366 275 L 402 338 Z"
            fill="#FFFFFF"/>
    </g>

    <!-- C. BRIGHT YELLOW CURVED SWOOSH UNDERLINE -->
    <path d="M 115 485 C 210 455, 330 455, 435 485 C 330 472, 210 472, 115 485 Z"
          fill="#FFB300" stroke="#7A0000" stroke-width="4" stroke-linejoin="round"/>

  </g>
</svg>
